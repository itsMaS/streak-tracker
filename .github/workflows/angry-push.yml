name: Angry raccoon push

# Sends the daily "check in" web push that wakes the app's service worker.
# The worker decides on the phone whether to show the angry raccoon
# (nothing logged today) or a quiet "streak safe" note.
#
# Times are UTC and GitHub cron can run up to ~15-30 min late.
# 17:00 UTC = 20:00 Vilnius in summer (EEST), 19:00 in winter (EET).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3
      - name: Send push
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node .github/send-push.js
